services:
  - type: web
    name: byosesemarket4
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /healthz
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_EMAIL
        value: byosemarket@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: *