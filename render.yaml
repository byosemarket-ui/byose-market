services:
  - type: web
    name: byosesemarket4
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /healthz
    plan: free
    autoDeploy: true
    disk:
      name: byosemarket-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_CLIENT
        value: sqlite
      - key: SQLITE_ENABLED
        value: true
      - key: SQLITE_DB_PATH
        value: data/byosemarket.sqlite
      - key: UPLOADS_DIR
        value: data/uploads
      - key: STORAGE_ROOT
        value: data/uploads
      - key: APP_BASE_URL
        value: https://byosesemarket4.onrender.com
      - key: API_BASE_URL
        value: https://byosesemarket4.onrender.com/api
      - key: ADMIN_EMAIL
        value: byosemarket@gmail.com
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: "https://byosemarket.com,https://www.byosemarket.com,https://byosesemarket4.onrender.com"
