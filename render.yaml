services:
  - type: web
    name: byosesemarket4
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /healthz
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_EMAIL
        value: byosemarket@gmail.com
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        value: "https://byosemarket.com,https://www.byosemarket.com,https://byosesemarket4.onrender.com"