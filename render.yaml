services:
  - type: web
    name: byosemarket-admin-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /healthz
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: byosemarket@gmail.com
      - key: ADMIN_PASSWORD_HASH
        value: $2a$10$Ei61K7tnrobboqgMMQL7TuF.m2N71NycCSGC2KoImdkKfDYK4nL.O
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://byosemarket.com,https://www.byosemarket.com,https://*.github.io,http://localhost:5000,http://127.0.0.1:5000,http://localhost:5500,http://127.0.0.1:5500