services:
  - type: web
    name: byosemarket-backend
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /healthz
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_EMAIL
        value: byosemarket@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://byosemarket.com,https://www.byosemarket.com,https://kwize250.github.io,https://*.github.io,http://localhost:5000,http://127.0.0.1:5000,http://localhost:5500,http://127.0.0.1:5500