# =============================================================================
# Byose Market — Production VPS Deployment
# =============================================================================
# Triggers on every push to main, connects to the production VPS over SSH,
# pulls the latest code, installs dependencies, reloads PM2, and verifies health.
#
# Required GitHub repository secrets:
#   VPS_HOST    - VPS public IP or hostname (e.g. 153.75.227.160)
#   VPS_USER    - SSH user (e.g. root)
#   VPS_PORT    - SSH port (e.g. 22; required — use 22 if standard)
#   VPS_SSH_KEY - Private SSH key (PEM) with access to the VPS
#
# Deployment blockers observed in Actions annotations:
#   1) GitHub account billing lock prevents runners from starting
#      ("The job was not started because your account is locked due to a billing issue.")
#   2) Built-in "pages build and deployment" is unrelated to production VPS.
#      Disable GitHub Pages (Settings → Pages → None) to stop deployment_queued
#      timeouts on the Pages deploy job. Production is served from the VPS.
#
# VPS prerequisites (one-time setup):
#   1. Clone this repo to /root/BYOSESEMARKET4
#   2. Configure /root/BYOSESEMARKET4/.env for production
#   3. Install Node.js, npm, PM2, and git on the VPS
#   4. Run: npm ci && npm run pm2:start
#   5. Add the GitHub Actions deploy public key to ~/.ssh/authorized_keys
# =============================================================================

name: Deploy to VPS

on:
  push:
    branches:
      - main
  # Allows manual redeploy from the GitHub Actions tab without a new commit.
  workflow_dispatch:

# Prevent overlapping production deploys. Cancel older queued/in-progress runs so
# a stuck job cannot block the latest production push indefinitely.
concurrency:
  group: production-vps-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy main to production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify required deploy secrets
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_PORT VPS_SSH_KEY; do
            # Secrets are injected as env below; empty means missing/misconfigured.
            eval "value=\${$name:-}"
            if [[ -z "${value}" ]]; then
              echo "::error::Missing required repository secret: ${name}"
              missing=1
            else
              echo "Secret ${name} is present."
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "::error::Configure VPS_HOST, VPS_USER, VPS_PORT, and VPS_SSH_KEY in repository Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            export DEPLOY_DIR="/root/BYOSESEMARKET4"
            export DEPLOY_BRANCH="main"
            cd "${DEPLOY_DIR}"
            git fetch origin "${DEPLOY_BRANCH}"
            git reset --hard "origin/${DEPLOY_BRANCH}"
            chmod +x scripts/deploy-vps.sh 2>/dev/null || true
            bash scripts/deploy-vps.sh

      - name: Verify public production health endpoint
        env:
          PUBLIC_HEALTH_URL: https://byosemarket.com/healthz
          PUBLIC_PRODUCTS_URL: https://byosemarket.com/api/products?limit=5&fields=card
          DIRECT_API_HEALTH_URL: http://153.75.227.160:5000/healthz
        run: |
          set -euo pipefail
          verify_json_health() {
            local url="$1"
            local body_file http_code
            body_file="$(mktemp)"
            http_code="$(curl -sS -o "${body_file}" -w "%{http_code}" --max-time 15 "${url}" || printf '000')"
            if [[ "${http_code}" != "200" ]]; then
              rm -f "${body_file}"
              echo "Health probe returned HTTP ${http_code} for ${url}"
              return 1
            fi
            if ! node -e "
              const fs = require('fs');
              const raw = fs.readFileSync(process.argv[1], 'utf8').trim();
              const payload = JSON.parse(raw);
              if (!payload || typeof payload.status !== 'string') process.exit(1);
              console.log('API health status:', payload.status, 'dbConnected=', payload.dbConnected);
            " "${body_file}"; then
              rm -f "${body_file}"
              echo "Response was HTTP 200 but not valid API health JSON for ${url}"
              return 1
            fi
            rm -f "${body_file}"
            return 0
          }

          echo "Checking ${PUBLIC_HEALTH_URL} ..."
          for attempt in $(seq 1 6); do
            if verify_json_health "${PUBLIC_HEALTH_URL}"; then
              echo "Public HTTPS health check passed."
              break
            fi
            if [[ "${attempt}" -eq 6 ]]; then
              echo "Falling back to direct API health ${DIRECT_API_HEALTH_URL} ..."
              verify_json_health "${DIRECT_API_HEALTH_URL}"
            fi
            echo "Public health check not ready (attempt ${attempt}/6)..."
            sleep 10
          done

          echo "Checking product API ${PUBLIC_PRODUCTS_URL} ..."
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          http_code="$(curl -sS -o "${body_file}" -D "${headers_file}" -w "%{http_code}" \
            -H 'Accept-Encoding: gzip' --max-time 20 "${PUBLIC_PRODUCTS_URL}" || printf '000')"
          [[ "${http_code}" == "200" ]] || { cat "${headers_file}"; exit 1; }
          node -e "
            const fs = require('fs');
            const zlib = require('zlib');
            const headers = fs.readFileSync(process.argv[1], 'utf8').toLowerCase();
            let body = fs.readFileSync(process.argv[2]);
            if (headers.includes('content-encoding: gzip')) {
              body = zlib.gunzipSync(body);
            }
            const payload = JSON.parse(body.toString('utf8'));
            if (!payload || payload.success !== true || !Array.isArray(payload.products)) process.exit(1);
            console.log('Products OK count=', payload.products.length, 'view=', payload.view || 'full');
          " "${headers_file}" "${body_file}"
          rm -f "${headers_file}" "${body_file}"
          echo "Production verification passed."
