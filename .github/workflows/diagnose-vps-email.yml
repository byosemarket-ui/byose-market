# Safe production email diagnosis. Never prints secret values.
# Trigger: workflow_dispatch or a change to this file / the diagnose script.

name: Diagnose VPS email

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-vps-email.yml'
      - 'scripts/diagnose-vps-email.sh'

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect VPS email configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnosis script
        uses: actions/checkout@v4

      - name: Diagnose production email environment over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 8m
          # appleboy/ssh-action script_stop injects a bash exit-code check after
          # every newline. That corrupts Python/bash heredocs (SyntaxError on
          # DRONE_SSH_PREV_COMMAND_EXIT_CODE). The remote script uses set -e.
          script_stop: false
          script_path: scripts/diagnose-vps-email.sh
