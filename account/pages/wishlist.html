<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist | Byose Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/account-features.css">
  <link rel="stylesheet" href="../css/wishlist.css">
</head>
<body class="account-feature-page wishlist-page">
  <main class="af-shell">
    <section class="af-card">
      <div class="af-header">
        <div class="af-header__brand">
          <span class="af-header__icon is-wishlist" aria-hidden="true"><i class="fa-solid fa-heart"></i></span>
          <div>
            <h1>Wishlist</h1>
            <p>Products you save while shopping stay with your account.</p>
          </div>
        </div>
        <div class="af-actions">
          <button type="button" class="af-button is-danger" id="clearWishlist" hidden aria-label="Clear entire wishlist">Clear all</button>
          <a class="af-back" href="../account.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Account</a>
        </div>
      </div>

      <div class="af-toolbar wishlist-toolbar">
        <span class="af-count-chip wishlist-count-chip" id="wishlistCountChip" hidden>
          <i class="fa-solid fa-heart" aria-hidden="true"></i>
          <span id="wishlistCountLabel">0 items</span>
        </span>
        <a class="af-button" href="../../shop.html">Continue Shopping</a>
      </div>

      <div id="wishlistStatusHost" aria-live="polite"></div>
      <div id="wishlistItems" class="wishlist-grid af-product-grid" aria-live="polite"></div>
    </section>
  </main>

  <div class="wishlist-toast" id="wishlistToast" role="status" aria-live="polite"></div>

  <script src="../../services/authservice.js"></script>
  <script src="../../services/wishlist-client.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../services/account-features-api.js"></script>
  <script src="../services/wishlist.service.js"></script>
  <script type="module" src="../../js/byose-cart-bootstrap.js"></script>
  <script src="../js/wishlist-page.js"></script>
</body>
</html>
