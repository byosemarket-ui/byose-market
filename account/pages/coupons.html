<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Coupons | Byose Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/account-features.css">
  <link rel="stylesheet" href="../css/coupons.css">
</head>
<body class="account-feature-page coupons-page">
  <main class="af-shell">
    <section class="af-card">
      <div class="af-header">
        <div class="af-header__brand">
          <span class="af-header__icon is-coupons" aria-hidden="true"><i class="fa-solid fa-ticket"></i></span>
          <div>
            <h1>My Coupons</h1>
            <p>View available discounts and use them at checkout.</p>
          </div>
        </div>
        <div class="af-actions">
          <a class="af-back" href="../account.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Account</a>
        </div>
      </div>

      <form class="af-form" id="applyCouponForm" aria-label="Add a coupon code">
        <input id="couponCodeInput" type="text" name="code" maxlength="40" placeholder="Enter coupon code" autocomplete="off" required aria-label="Coupon code">
        <button class="af-button is-primary" type="submit">Add coupon</button>
      </form>

      <div class="af-toolbar coupons-toolbar">
        <span class="af-count-chip coupons-count-chip" id="couponsCountChip" hidden>
          <i class="fa-solid fa-ticket" aria-hidden="true"></i>
          <span id="couponsCountLabel">0 available</span>
        </span>
        <a class="af-button" href="../../shop.html">Continue Shopping</a>
      </div>

      <div class="af-tabs" role="tablist" aria-label="Coupon filters">
        <button type="button" class="af-tab is-active" data-status="available" role="tab" aria-selected="true">Available</button>
        <button type="button" class="af-tab" data-status="used" role="tab" aria-selected="false">Used</button>
        <button type="button" class="af-tab" data-status="expired" role="tab" aria-selected="false">Expired</button>
        <button type="button" class="af-tab" data-status="not_eligible" role="tab" aria-selected="false">Not Eligible</button>
        <button type="button" class="af-tab" data-status="all" role="tab" aria-selected="false">All</button>
      </div>

      <div id="couponsStatusHost" aria-live="polite"></div>
      <div id="couponItems" class="coupons-list" aria-live="polite"></div>
    </section>
  </main>

  <div class="coupons-toast" id="couponsToast" role="status" aria-live="polite"></div>

  <script src="../../services/authservice.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../services/account-features-api.js"></script>
  <script src="../services/coupon.service.js"></script>
  <script src="../js/coupons-page.js"></script>
</body>
</html>
