<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, private">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recently Viewed | Byose Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/account-features.css">
  <link rel="stylesheet" href="../css/recent.css">
</head>
<body class="account-feature-page recent-page">
  <main class="af-shell">
    <section class="af-card">
      <div class="af-header">
        <div class="af-header__brand">
          <span class="af-header__icon is-recent" aria-hidden="true"><i class="fa-solid fa-clock-rotate-left"></i></span>
          <div>
            <h1>Recently Viewed</h1>
            <p>Products you opened while shopping, newest first.</p>
          </div>
        </div>
        <div class="af-actions">
          <button type="button" class="af-button is-danger" id="clearRecent" hidden aria-label="Clear recently viewed history">Clear All</button>
          <a class="af-back" href="../account.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Account</a>
        </div>
      </div>

      <div class="af-toolbar recent-toolbar">
        <span class="af-count-chip recent-count-chip" id="recentCountChip" hidden>
          <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
          <span id="recentCountLabel">0 items</span>
        </span>
        <a class="af-button" href="../../shop.html">Continue Shopping</a>
      </div>

      <div id="recentStatusHost" aria-live="polite"></div>
      <div id="recentItems" class="recent-grid af-product-grid" aria-live="polite"></div>
    </section>
  </main>

  <div class="recent-toast" id="recentToast" role="status" aria-live="polite"></div>

  <script src="../../services/authservice.js"></script>
  <script src="../../services/recently-viewed-tracker.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../services/account-features-api.js"></script>
  <script src="../services/recently-viewed.service.js"></script>
  <script type="module" src="../../js/byose-cart-bootstrap.js"></script>
  <script src="../js/recent-page.js"></script>
</body>
</html>
