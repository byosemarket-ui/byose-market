<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, private">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorite Stores | Byose Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/account-features.css">
  <link rel="stylesheet" href="../css/stores.css">
</head>
<body class="account-feature-page stores-page">
  <main class="af-shell">
    <section class="af-card">
      <div class="af-header">
        <div class="af-header__brand">
          <span class="af-header__icon is-stores" aria-hidden="true"><i class="fa-solid fa-store"></i></span>
          <div>
            <h1>Favorite Stores</h1>
            <p>Follow sellers you like and reopen them quickly from your account.</p>
          </div>
        </div>
        <div class="af-actions">
          <a class="af-back" href="../account.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Account</a>
        </div>
      </div>

      <div class="af-toolbar stores-toolbar">
        <span class="af-count-chip stores-count-chip" id="storesCountChip" hidden>
          <i class="fa-solid fa-store" aria-hidden="true"></i>
          <span id="storesCountLabel">0 stores</span>
        </span>
        <a class="af-button" href="#discover">Explore Stores</a>
      </div>

      <div id="storesStatusHost" aria-live="polite"></div>

      <h2 class="stores-section-title">Following</h2>
      <div id="favoriteStores" class="stores-grid" aria-live="polite"></div>

      <div class="discover-panel" id="discover">
        <h2 class="stores-section-title">Discover stores</h2>
        <div id="discoverStores" class="stores-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div class="stores-toast" id="storesToast" role="status" aria-live="polite"></div>

  <script src="../../services/authservice.js"></script>
  <script src="../../services/favorite-stores-client.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../services/account-features-api.js"></script>
  <script src="../services/favorite-stores.service.js"></script>
  <script src="../js/stores-page.js"></script>
</body>
</html>
