<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, private">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile — ByoseMarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <meta name="description" content="Manage your ByoseMarket customer profile">
  <style>
    :root{
      --bg-grad: linear-gradient(180deg,#f7f9fc 0%,#eef4fb 100%);
      --card-bg: rgba(255,255,255,0.72);
      --muted: #6b7280;
      --accent: #0066ff;
      --accent-soft: rgba(0,102,255,0.1);
      --danger: #e53935;
      --success: #16a34a;
      --glass-border: rgba(255,255,255,0.7);
      --shadow: 0 6px 18px rgba(18,38,63,0.08);
      --radius: 14px;
      --text: #0f172a;
    }
    html,body{height:100%;}
    body{
      margin:0;
      font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial;
      background:var(--bg-grad);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      padding-bottom:40px;
    }
    .app{max-width:820px;margin:0 auto;padding:18px;box-sizing:border-box;}
    header.app-header{
      position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
      padding:12px 8px;backdrop-filter:blur(10px);
      background:rgba(255,255,255,0.55);border:1px solid rgba(15,23,42,0.04);
      border-radius:12px;box-shadow:var(--shadow);
    }
    .back-btn{
      display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;
      background:var(--card-bg);border:1px solid var(--glass-border);color:var(--accent);text-decoration:none;
    }
    .app-title{flex:1;text-align:center;font-weight:600;font-size:16px;}
    .card{
      margin-top:14px;background:var(--card-bg);border-radius:var(--radius);
      padding:16px;box-shadow:var(--shadow);border:1px solid var(--glass-border);backdrop-filter:blur(8px);
    }
    .avatar-wrap{display:flex;align-items:center;gap:14px;}
    .profile-avatar{
      width:86px;height:86px;border-radius:50%;overflow:hidden;position:relative;
      flex:0 0 86px;background:linear-gradient(180deg,#fff,#eef2ff);
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(255,255,255,0.7);
    }
    .profile-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
    .avatar-initial{
      font-size:34px;font-weight:700;color:var(--accent);
      width:100%;height:100%;display:flex;align-items:center;justify-content:center;
      background:var(--accent-soft);
    }
    .edit-avatar{
      position:absolute;right:-2px;bottom:-2px;background:var(--accent);color:#fff;
      width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      border:3px solid rgba(255,255,255,0.85);cursor:pointer;box-shadow:0 6px 12px rgba(0,102,255,0.2);
    }
    .avatar-meta{flex:1;min-width:0;}
    .user-name{font-weight:600;font-size:17px;}
    .user-sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.4;}
    .summary-list{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
    .summary-row{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:12px;border-radius:12px;background:rgba(255,255,255,0.45);
    }
    .summary-row .label{color:var(--muted);font-size:13px;}
    .summary-row .value{font-weight:600;font-size:14px;text-align:right;word-break:break-word;}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
    label{font-size:13px;color:var(--muted);}
    input{
      padding:10px 12px;border-radius:10px;border:1px solid rgba(15,23,42,0.08);
      background:rgba(255,255,255,0.9);font-size:14px;font-family:inherit;outline:none;
    }
    input:focus{border-color:rgba(0,102,255,0.45);box-shadow:0 0 0 3px rgba(0,102,255,0.12);}
    .hint{font-size:12px;color:var(--muted);line-height:1.4;}
    .form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
    .save-btn,.secondary-btn{
      appearance:none;border:none;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;font-size:14px;
    }
    .save-btn{background:var(--accent);color:#fff;}
    .save-btn:disabled{opacity:0.65;cursor:wait;}
    .secondary-btn{background:rgba(15,23,42,0.06);color:var(--text);}
    .status{font-size:13px;margin:0 0 12px;display:none;}
    .status.is-visible{display:block;}
    .status.is-error{color:var(--danger);}
    .status.is-success{color:var(--success);}
    .sr-only{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
    @media(min-width:720px){
      .app{padding:28px;}
      .card{padding:20px;}
    }
  </style>
</head>
<body>
  <div class="app" id="profileApp">
    <header class="app-header">
      <a class="back-btn" href="settings.html" aria-label="Back to settings">
        <i class="fa fa-arrow-left" aria-hidden="true"></i>
      </a>
      <div class="app-title">Profile</div>
      <div style="width:40px"></div>
    </header>

    <section class="card" aria-labelledby="profile-heading">
      <h2 id="profile-heading" class="sr-only">Your profile</h2>
      <div class="avatar-wrap">
        <div class="profile-avatar" id="avatarContainer">
          <input id="avatarInput" type="file" accept="image/*" class="sr-only" aria-label="Upload profile photo">
          <button type="button" class="edit-avatar" id="editAvatarBtn" title="Change photo" aria-label="Change profile photo">
            <i class="fa fa-camera" aria-hidden="true"></i>
          </button>
        </div>
        <div class="avatar-meta">
          <div class="user-name" id="profileDisplayName">Loading…</div>
          <div class="user-sub" id="profileDisplaySub"></div>
        </div>
      </div>
      <div class="summary-list">
        <div class="summary-row">
          <div class="label">Customer ID</div>
          <div class="value" id="profileCustomerId">—</div>
        </div>
        <div class="summary-row">
          <div class="label">Email</div>
          <div class="value" id="profileSummaryEmail">—</div>
        </div>
        <div class="summary-row">
          <div class="label">Phone</div>
          <div class="value" id="profileSummaryPhone">—</div>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="edit-profile-heading">
      <div id="edit-profile-heading" style="font-weight:600;margin-bottom:10px;">Edit profile</div>
      <p id="profileStatus" class="status" role="status" aria-live="polite"></p>
      <form id="profileForm" autocomplete="on">
        <div class="field">
          <label for="profileName">Full name</label>
          <input id="profileName" name="name" type="text" required maxlength="120" placeholder="Your full name">
        </div>
        <div class="field">
          <label for="profileEmail">Email</label>
          <input id="profileEmail" name="email" type="email" maxlength="160" placeholder="you@example.com">
          <p class="hint">Email is used for account access and order updates. It must be unique.</p>
        </div>
        <div class="field">
          <label for="profilePhone">Phone number</label>
          <input id="profilePhone" name="phone" type="tel" maxlength="20" placeholder="+250 7XX XXX XXX">
          <p class="hint">Use a Rwanda mobile number. Phone updates must not belong to another account.</p>
        </div>
        <div class="form-actions">
          <button type="submit" class="save-btn" id="saveProfileBtn">Save changes</button>
          <button type="button" class="secondary-btn" id="removePhotoBtn" hidden>Remove photo</button>
        </div>
      </form>
    </section>
  </div>

  <script src="../../services/authservice.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/user-display.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
