<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../config/runtime-api-bootstrap.js"></script>
  <title>Admin Login | Byose Market</title>

  <!-- CSS -->
  <link rel="stylesheet" href="admin-login.css">
</head>

<body>

  <main class="login">
    
    <!-- Login Card -->
    <section class="login__card">

      <div class="login__brand" id="adminLoginBrand">
        <img id="adminLoginLogo" src="../../img/logo.png" alt="BYOSE Market" width="64" height="64" data-brand-logo="login" />
      </div>

      <!-- Title -->
      <header class="login__header">
        <h1 class="login__title">Admin Login</h1>
        <p class="login__subtitle" id="adminLoginTagline">Sign in to manage your store</p>
      </header>

      <!-- Form -->
      <form id="loginForm" class="login__form">

        <!-- Email -->
        <div class="form__group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your email"
            required
            autocomplete="email"
          >
        </div>

        <!-- Password -->
        <div class="form__group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>

        <!-- Button -->
        <button type="submit" class="btn btn--primary" aria-busy="false">
          <span class="btn-text">Login</span>
          <span class="btn-loader" style="display: none;">
            <span class="spinner"></span>
          </span>
        </button>

      </form>

      <!-- Message -->
      <div class="form__message-container">
        <p id="message" class="form__message" role="alert" aria-live="polite"></p>
      </div>

    </section>

  </main>

  <!-- JS -->
  <script src="js/admin-security.js"></script>
  <script src="../../js/storefront-settings.js"></script>
  <script type="module" src="admin-login.js"></script>
  <script>
    window.addEventListener("byose:store-settings", function (event) {
      var branding = event.detail && event.detail.branding ? event.detail.branding : {};
      var logos = branding.logos || {};
      var colors = branding.colors || {};
      var identity = branding.identity || {};
      var logo = document.getElementById("adminLoginLogo");
      var nextLogo = logos.loginLogo || logos.adminLogo || logos.mainLogo;
      if (logo && nextLogo) logo.src = nextLogo;
      if (colors.primary) {
        document.documentElement.style.setProperty("--login-primary", colors.primary);
      }
      var tagline = document.getElementById("adminLoginTagline");
      if (tagline && identity.tagline) tagline.textContent = identity.tagline;
    });
  </script>

</body>
</html>
