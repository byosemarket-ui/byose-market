# Direct disk serving for uploaded product/media files.
# Included inside each server {} block. Must NOT fall through to SPA try_files.
# Canonical path: /var/lib/byosemarket/uploads (regenerated on deploy by fix-vps-uploads-serving.sh)
# Long TTL is safe because upload filenames are unique UUIDs (never overwritten in place).
location ^~ /uploads/ {
    alias /var/lib/byosemarket/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    # Do not cache negative lookups — deleted/replaced hero images must 404 immediately.
    open_file_cache_errors off;
    types {
        image/jpeg  jpg jpeg;
        image/png   png;
        image/webp  webp;
        image/gif   gif;
        image/avif  avif;
    }
    default_type application/octet-stream;
}
