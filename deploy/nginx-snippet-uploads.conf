# Direct disk serving for uploaded product/media files.
# Included inside each server {} block. Must NOT fall through to SPA try_files.
location ^~ /uploads/ {
    alias /root/BYOSESEMARKET4/server/uploads/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    types {
        image/jpeg  jpg jpeg;
        image/png   png;
        image/webp  webp;
        image/gif   gif;
        image/avif  avif;
    }
    default_type application/octet-stream;
}
