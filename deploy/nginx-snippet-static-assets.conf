# Serve static storefront assets directly — never SPA-fallback to index.html for missing JS/CSS.
location ~* \.(?:js|mjs|css|map|json|woff2?|ttf|eot)$ {
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    gzip_static off;
}

location ~* \.(?:svg)$ {
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~* \.(?:png|jpe?g|gif|webp|avif|ico)$ {
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}
