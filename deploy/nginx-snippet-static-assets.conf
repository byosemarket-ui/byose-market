# Admin console modules are an unhashed ES-module graph. A stale Admin JS file
# (for example pages/orders.js) prevents the entire console from evaluating and
# leaves /admin/dashboard.html blank except for CSS. Revalidate Admin assets
# immediately after deploy without changing storefront JS caching.
location ~* ^/(?:admin\.js$|admin/.*\.(?:js|mjs|css)$) {
    try_files $uri =404;
    access_log off;
    etag on;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    gzip_static off;
}

# Serve static storefront assets directly — never SPA-fallback to index.html for missing JS/CSS.
# JS/CSS use short cache + revalidation so deploys reach browsers quickly.
location ~* \.(?:js|mjs|css|map)$ {
    try_files $uri =404;
    access_log off;
    etag on;
    add_header Cache-Control "public, max-age=60, stale-while-revalidate=600" always;
    add_header X-Content-Type-Options "nosniff" always;
    gzip_static off;
}

location ~* \.(?:json|woff2?|ttf|eot)$ {
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~* \.(?:svg)$ {
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~* \.(?:png|jpe?g|gif|webp|avif|ico)$ {
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}
