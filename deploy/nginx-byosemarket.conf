# Byose Market production nginx site
#
# Canonical paths (must match scripts/deploy-vps.sh and ecosystem.config.js):
#   API repo:     /root/BYOSESEMARKET4
#   Storefront:   /var/www/byosemarket
#   Uploads disk: /var/lib/byosemarket/uploads
#
# Install:
#   sudo bash scripts/fix-vps-uploads-serving.sh
#   # or
#   sudo bash scripts/setup-vps-proxy.sh

upstream byosemarket_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name 153.75.227.160 byosemarket.com www.byosemarket.com;

    root /var/www/byosemarket;
    index index.html;

    client_max_body_size 10M;

    # Allow certbot HTTP-01 renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    include /etc/nginx/snippets/byosemarket-uploads.conf;
    include /etc/nginx/snippets/byosemarket-static-assets.conf;

    location /api/ {
        proxy_pass http://byosemarket_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass http://byosemarket_api/healthz;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://byosemarket_api/readyz;
        proxy_set_header Host $host;
    }

    # Storefront SPA — /uploads/ is excluded by the ^~ block above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 153.75.227.160 byosemarket.com www.byosemarket.com;

    root /var/www/byosemarket;
    index index.html;

    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/byosemarket.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byosemarket.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/byosemarket-uploads.conf;
    include /etc/nginx/snippets/byosemarket-static-assets.conf;

    location /api/ {
        proxy_pass http://byosemarket_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass http://byosemarket_api/healthz;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://byosemarket_api/readyz;
        proxy_set_header Host $host;
    }

    # Storefront SPA — /uploads/ is excluded by the ^~ block above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
