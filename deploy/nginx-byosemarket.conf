# Byose Market production nginx site (performance-optimized)
#
# Canonical paths (must match scripts/deploy-vps.sh and ecosystem.config.js):
#   API repo:     /root/byose-market  (legacy: /root/BYOSESEMARKET4)
#   GitHub:       https://github.com/byosemarket-ui/byose-market.git
#   Storefront:   /var/www/byosemarket
#   Uploads disk: /var/lib/byosemarket/uploads
#
# Install:
#   sudo bash scripts/optimize-vps.sh
#   # or
#   sudo bash scripts/fix-vps-uploads-serving.sh

upstream byosemarket_api {
    server 127.0.0.1:5000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen [::]:80;
    server_name 153.75.227.160 byosemarket.com www.byosemarket.com;

    # Force HTTPS for the public domain (keep ACME on HTTP).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Keep local/deploy health and API probes on HTTP working while the
    # public site still forces HTTPS for storefront traffic.
    location ^~ /api/realtime/ {
        proxy_pass http://byosemarket_api/api/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://byosemarket_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /healthz {
        proxy_pass http://byosemarket_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /readyz {
        proxy_pass http://byosemarket_api/readyz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 153.75.227.160 byosemarket.com www.byosemarket.com;

    root /var/www/byosemarket;
    index index.html;

    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # TLS
    ssl_certificate /etc/letsencrypt/live/byosemarket.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byosemarket.com/privkey.pem;
    # Keep TLS settings self-contained. The VPS's Certbot-managed include has
    # previously contained duplicate session directives, which makes `nginx -t`
    # fail before a deployment can reload the service.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:ByoseSSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        application/font-woff
        application/font-woff2;

    # File cache for static serving
    open_file_cache max=5000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Security headers (storefront + proxied API inherit via add_header always)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Block hidden / sensitive paths from the public web root.
    location ~* /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* ^/(?:\.env|package\.json|package-lock\.json|ecosystem\.config\.js|server/|node_modules/|\.git/) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    include /etc/nginx/snippets/byosemarket-uploads.conf;
    include /etc/nginx/snippets/byosemarket-static-assets.conf;

    # SSE must disable buffering and keep the connection open.
    location ^~ /api/realtime/ {
        proxy_pass http://byosemarket_api/api/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://byosemarket_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location = /metrics {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location /healthz {
        proxy_pass http://byosemarket_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /readyz {
        proxy_pass http://byosemarket_api/readyz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Storefront HTML — always revalidate so deploys show up immediately.
    # NOTE: location-level add_header replaces server-level add_header inheritance.
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    }

    # Storefront SPA — /uploads/ is excluded by the ^~ block above.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    }
}
