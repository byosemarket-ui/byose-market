<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Byose Market</title>
  <meta name="description" content="Review your cart, save items for later, and proceed to checkout on Byose Market.">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/home-mobile.css">
  <link rel="stylesheet" href="css/home-desktop.css">
  <link rel="stylesheet" href="css/cart-page.css">
  <link rel="stylesheet" href="mobile-nav.css">
  <script src="config/runtime-api-bootstrap.js"></script>
</head>
<body class="home-page cart-page">
  <header class="main-header" id="mainHeader" data-sticky-header>
    <div class="container header-shell">
      <div class="header-mobile-top">
        <a class="brand brand-mobile" href="index.html" aria-label="Byose Market Home">
          <img class="brand-logo" src="img/logo.png" alt="Byose Market logo">
        </a>
        <a href="cart.html" class="icon-btn mobile-messages-btn" aria-label="Cart">
          <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
        </a>
      </div>
      <a class="brand header-desktop-brand" href="index.html" aria-label="Byose Market Home">
        <img class="brand-logo" src="img/logo.png" alt="Byose Market logo">
      </a>
      <nav class="header-nav nav header-desktop-nav" aria-label="Main navigation">
        <a href="index.html" class="nav-link" data-page="home"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="shop.html" class="nav-link" data-page="shop"><i class="fa-solid fa-store"></i><span>Shop</span></a>
        <a href="contact.html" class="nav-link" data-page="contact"><i class="fa-regular fa-envelope"></i><span>Contact</span></a>
      </nav>
      <div class="header-actions header-desktop-actions">
        <a href="cart.html" class="icon-btn" id="cartBtn" aria-label="Cart"><i class="fa-solid fa-cart-shopping"></i></a>
        <a href="login.html" class="icon-btn" id="accountBtn" aria-label="Account"><i class="fa-regular fa-user"></i></a>
      </div>
    </div>
  </header>

  <main class="cart-page__main">
    <div class="container cart-page__layout">
      <section>
        <div class="cart-page__header">
          <h1 class="cart-page__title">Shopping Cart</h1>
          <span class="cart-page__count" id="cartCount">0 items</span>
        </div>

        <div class="cart-panel">
          <div class="cart-panel__head">
            <h2 class="cart-panel__title">Cart items</h2>
            <label class="cart-select-all">
              <input type="checkbox" id="cartSelectAll" aria-label="Select all items">
              Select all
            </label>
          </div>
          <div class="cart-items" id="cartItems" aria-live="polite"></div>
        </div>

        <section class="cart-saved" id="savedSection" hidden>
          <div class="cart-panel">
            <div class="cart-panel__head">
              <h2 class="cart-panel__title">Saved for later</h2>
            </div>
            <div class="cart-items" id="savedItems"></div>
          </div>
        </section>
      </section>

      <aside class="cart-panel cart-summary" aria-label="Order summary">
        <h2 class="cart-summary__title">Order summary</h2>
        <div class="cart-summary__rows">
          <div class="cart-summary__row"><span>Selected items</span><strong id="summarySelected">0</strong></div>
          <div class="cart-summary__row"><span>Subtotal</span><strong id="summarySubtotal">RWF 0</strong></div>
          <div class="cart-summary__row"><span>Discounts</span><strong id="summaryDiscount">RWF 0</strong></div>
          <div class="cart-summary__row"><span>Delivery</span><strong id="summaryShipping">RWF 0</strong></div>
          <div class="cart-summary__row"><span>Tax</span><strong id="summaryTax">RWF 0</strong></div>
          <div class="cart-summary__row cart-summary__row--total"><span>Total</span><strong id="summaryTotal">RWF 0</strong></div>
        </div>
        <button type="button" class="cart-btn cart-btn--primary" id="checkoutBtn" disabled>Proceed to checkout</button>
        <button type="button" class="cart-btn cart-btn--ghost" id="whatsappBtn" disabled><i class="fa-brands fa-whatsapp"></i> Order via WhatsApp</button>
      </aside>
    </div>
  </main>

  <div class="cart-sticky-checkout" aria-hidden="false">
    <button type="button" class="cart-btn cart-btn--primary" id="stickyCheckoutBtn" disabled>
      Checkout · <span id="stickyTotal">RWF 0</span>
    </button>
  </div>

  <script src="services/authservice.js"></script>
  <script src="js/utils.js"></script>
  <script type="module" src="js/byose-cart-bootstrap.js"></script>
  <script src="js/header.js" defer></script>
  <script src="js/mobile-nav.js" defer></script>
  <script type="module" src="js/cart-page.js"></script>
</body>
</html>
