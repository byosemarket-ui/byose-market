<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review & Pay | Byose Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="checkout.css?v=20260822-review-pay-buttons">
</head>
<body>
  <div class="ck-shell">
    <div class="ck-layout">
      <main>
        <div class="ck-progress" id="progress"></div>
        <article class="ck-panel">
          <header class="ck-panel-head">
            <p>Step 2 of 2</p>
            <h1>Review & Pay</h1>
            <p>Review your order, then choose how you want to complete payment.</p>
          </header>
          <div id="message" hidden></div>
          <div id="shippingSummary"></div>
          <div id="deliveryInfo"></div>
          <div id="productList"></div>
          <div id="totalsBlock"></div>
          <form id="reviewForm">
            <div class="ck-actions ck-actions--review-pay">
              <a class="ck-btn ck-btn--ghost" href="shipping.html">Back</a>
              <div class="ck-payment-actions">
                <button type="button" class="ck-btn ck-btn--cod" id="codPayBtn">Cash on Delivery</button>
                <button type="button" class="ck-btn ck-btn--primary ck-btn--online" id="onlinePayBtn">Online Payment</button>
              </div>
            </div>
          </form>
        </article>
      </main>
      <aside class="ck-sidebar" id="sidebar"></aside>
    </div>
  </div>
  <div id="stickyBar"></div>
  <script src="../config/runtime-api-bootstrap.js"></script>
  <script type="module" src="checkout.js?v=20260815-step3-dpo-handoff"></script>
</body>
</html>
