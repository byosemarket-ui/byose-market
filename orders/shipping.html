<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping | Byose Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="checkout.css?v=20260815-step2-review-pay">
</head>
<body>
  <div class="ck-shell">
    <div class="ck-layout">
      <main>
        <div class="ck-progress" id="progress"></div>
        <article class="ck-panel ck-panel--shipping">
          <header class="ck-panel-head">
            <p>Step 1 of 2</p>
            <h1>Shipping</h1>
            <p>Enter your delivery address in Rwanda.</p>
          </header>
          <div id="message" class="ck-message" hidden role="alert"></div>
          <form id="shippingForm" class="ck-form-grid ck-shipping-form" novalidate>
            <section class="ck-shipping-section" aria-labelledby="shippingContactTitle">
              <h2 class="ck-shipping-section__title" id="shippingContactTitle">Contact</h2>
              <div class="ck-shipping-section__grid">
                <label class="ck-field ck-field--full">
                  <span class="ck-field__label">Full Name</span>
                  <input
                    type="text"
                    name="fullName"
                    autocomplete="name"
                    placeholder="Andika amazina yawe yose"
                    aria-required="true"
                    aria-describedby="error-fullName"
                  >
                  <small class="ck-field-error" id="error-fullName" data-error="fullName"></small>
                </label>
                <label class="ck-field ck-field--full">
                  <span class="ck-field__label">Phone Number</span>
                  <input
                    type="tel"
                    name="phone"
                    autocomplete="tel"
                    inputmode="tel"
                    placeholder="Andika nimero ya telefone"
                    aria-required="true"
                    aria-describedby="error-phone"
                  >
                  <small class="ck-field-error" id="error-phone" data-error="phone"></small>
                </label>
              </div>
            </section>

            <section class="ck-shipping-section" aria-labelledby="shippingAddressTitle">
              <h2 class="ck-shipping-section__title" id="shippingAddressTitle">Delivery address</h2>
              <div class="ck-shipping-section__grid">
                <div class="ck-form-row">
                  <label class="ck-field">
                    <span class="ck-field__label">Province / City</span>
                    <input
                      type="text"
                      name="provinceCity"
                      autocomplete="address-level1"
                      placeholder="Hitamo Intara cyangwa Umujyi"
                      aria-required="true"
                      aria-describedby="error-provinceCity"
                    >
                    <small class="ck-field-error" id="error-provinceCity" data-error="provinceCity"></small>
                  </label>
                  <label class="ck-field">
                    <span class="ck-field__label">District</span>
                    <input
                      type="text"
                      name="district"
                      autocomplete="address-level2"
                      placeholder="Hitamo Akarere"
                      aria-required="true"
                      aria-describedby="error-district"
                    >
                    <small class="ck-field-error" id="error-district" data-error="district"></small>
                  </label>
                </div>
                <div class="ck-form-row">
                  <label class="ck-field">
                    <span class="ck-field__label">Sector</span>
                    <input
                      type="text"
                      name="sector"
                      placeholder="Hitamo Umurenge"
                      aria-required="true"
                      aria-describedby="error-sector"
                    >
                    <small class="ck-field-error" id="error-sector" data-error="sector"></small>
                  </label>
                  <label class="ck-field">
                    <span class="ck-field__label">Cell</span>
                    <input
                      type="text"
                      name="cell"
                      placeholder="Hitamo Akagari"
                      aria-required="true"
                      aria-describedby="error-cell"
                    >
                    <small class="ck-field-error" id="error-cell" data-error="cell"></small>
                  </label>
                </div>
                <div class="ck-form-row">
                  <label class="ck-field">
                    <span class="ck-field__label">Village</span>
                    <input
                      type="text"
                      name="village"
                      placeholder="Andika Umudugudu"
                      aria-required="true"
                      aria-describedby="error-village"
                    >
                    <small class="ck-field-error" id="error-village" data-error="village"></small>
                  </label>
                  <label class="ck-field">
                    <span class="ck-field__label">Landmark / Note <span class="ck-gps-optional">(optional)</span></span>
                    <input
                      type="text"
                      name="note"
                      placeholder="Andika ahantu hafasha kukubona"
                      aria-describedby="error-note"
                    >
                    <small class="ck-field-error" id="error-note" data-error="note"></small>
                  </label>
                </div>
              </div>
            </section>

            <section class="ck-gps-card" id="gpsCard" data-state="detecting" aria-live="polite">
              <div class="ck-gps-card__copy">
                <div class="ck-gps-card__title-row">
                  <h3>Device Location <span class="ck-gps-optional">(optional)</span></h3>
                  <span class="ck-gps-badge" id="gpsBadge" data-state="detecting">Locating</span>
                </div>
                <p id="gpsStatus">Detecting location... Optional — you can continue with a typed address.</p>
                <div class="ck-gps-meta" id="gpsMeta"></div>
                <button type="button" class="ck-gps-retry" id="gpsRetryBtn" hidden>Retry location</button>
              </div>
              <a class="ck-map-link" id="gpsMapLink" href="#" target="_blank" rel="noopener" hidden>Open in Maps</a>
            </section>

            <div class="ck-actions ck-actions--shipping">
              <a class="ck-btn ck-btn--ghost" id="shippingBackLink" href="../cart.html">Back</a>
              <button type="submit" class="ck-btn ck-btn--primary" id="shippingContinueBtn">Continue to Review</button>
            </div>
          </form>
        </article>
      </main>
      <aside class="ck-sidebar" id="sidebar"></aside>
    </div>
  </div>
  <div id="stickyBar"></div>
  <script src="../config/runtime-api-bootstrap.js"></script>
  <script src="../js/storefront-settings.js" defer></script>
  <script src="shipping-api.js?v=20260813-delivery-fee"></script>
  <script type="module" src="shipping.js?v=20260813-step4-lifecycle"></script>
</body>
</html>
