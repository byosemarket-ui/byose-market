<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping | Byose Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="checkout.css">
</head>
<body>
  <div class="ck-shell">
    <div class="ck-layout">
      <main>
        <div class="ck-progress" id="progress"></div>
        <article class="ck-panel">
          <header class="ck-panel-head">
            <p>Step 1 of 4</p>
            <h1>Shipping</h1>
            <p>Enter your delivery address in Rwanda.</p>
          </header>
          <div id="message" hidden></div>
          <form id="shippingForm" class="ck-form-grid" novalidate>
            <label class="ck-field ck-field--full">
              <span>Full Name *</span>
              <input type="text" name="fullName" autocomplete="name" placeholder="Enter full name">
              <small class="ck-field-error" data-error="fullName"></small>
            </label>
            <label class="ck-field ck-field--full">
              <span>Phone Number *</span>
              <input type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="07XXXXXXXX">
              <small class="ck-field-error" data-error="phone"></small>
            </label>
            <div class="ck-form-row">
              <label class="ck-field">
                <span>Province / City *</span>
                <input type="text" name="provinceCity" autocomplete="address-level1" placeholder="Kigali City">
                <small class="ck-field-error" data-error="provinceCity"></small>
              </label>
              <label class="ck-field">
                <span>District *</span>
                <input type="text" name="district" autocomplete="address-level2" placeholder="Gasabo">
                <small class="ck-field-error" data-error="district"></small>
              </label>
            </div>
            <div class="ck-form-row">
              <label class="ck-field">
                <span>Sector *</span>
                <input type="text" name="sector" placeholder="Kimironko">
                <small class="ck-field-error" data-error="sector"></small>
              </label>
              <label class="ck-field">
                <span>Cell *</span>
                <input type="text" name="cell" placeholder="Bibare">
                <small class="ck-field-error" data-error="cell"></small>
              </label>
            </div>
            <div class="ck-form-row">
              <label class="ck-field">
                <span>Village *</span>
                <input type="text" name="village" placeholder="Village name">
                <small class="ck-field-error" data-error="village"></small>
              </label>
              <label class="ck-field">
                <span>Landmark / Note</span>
                <input type="text" name="note" placeholder="Nearby landmark">
              </label>
            </div>
            <section class="ck-gps-card" aria-live="polite">
              <div>
                <h3>Device Location</h3>
                <p id="gpsStatus">Requesting permission...</p>
                <div class="ck-gps-meta" id="gpsMeta"></div>
              </div>
              <a class="ck-map-link" id="gpsMapLink" href="#" target="_blank" rel="noopener" hidden>Maps</a>
            </section>
            <div class="ck-actions">
              <a class="ck-btn ck-btn--ghost" href="../cart.html">Back</a>
              <button type="button" class="ck-btn ck-btn--primary" id="shippingContinueBtn">Continue to Review</button>
            </div>
          </form>
        </article>
      </main>
      <aside class="ck-sidebar" id="sidebar"></aside>
    </div>
  </div>
  <div id="stickyBar"></div>
  <script type="module" src="shipping.js"></script>
</body>
</html>
