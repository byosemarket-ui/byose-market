<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment | Byose Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="checkout.css">
</head>
<body>
  <div class="ck-shell">
    <div class="ck-layout">
      <main>
        <div class="ck-progress" id="progress"></div>
        <article class="ck-panel">
          <header class="ck-panel-head">
            <p>Step 3 of 4</p>
            <h1>Payment</h1>
            <p>Choose how you want to pay.</p>
          </header>
          <div id="message" hidden></div>
          <form id="paymentForm" class="ck-form-grid">
            <fieldset class="ck-pay-methods" id="paymentMethods"></fieldset>
            <label class="ck-field ck-field--full" id="paymentPhoneField">
              <span>Payment Phone Number *</span>
              <input type="tel" name="paymentPhone" inputmode="tel" placeholder="07XXXXXXXX">
              <small class="ck-field-error" data-error="phone"></small>
            </label>
            <div id="totalsBlock"></div>
            <div class="ck-actions">
              <a class="ck-btn ck-btn--ghost" href="checkout.html">Back</a>
              <button type="submit" class="ck-btn ck-btn--primary" id="placeOrderBtn">Place Order</button>
            </div>
          </form>
        </article>
      </main>
      <aside class="ck-sidebar" id="sidebar"></aside>
    </div>
  </div>
  <div id="stickyBar"></div>
  <script type="module" src="payment.js"></script>
</body>
</html>
